name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch bundled Frida binaries
        run: python3 tools/frida/fetch_frida.py

      - name: Build (assemble debug + perf)
        run: |
          chmod +x gradlew
          ./gradlew :core:testDebugUnitTest :app:assembleDebug :app:assemblePerf --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mika-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/perf/*.apk
          if-no-files-found: error
