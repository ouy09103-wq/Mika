name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 自带 Android SDK(ANDROID_HOME);只补 license 与缺的 SDK 包
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null

      - name: Fetch bundled Frida binaries
        run: python3 tools/frida/fetch_frida.py

      - name: Build (assemble debug + perf)
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleDebug :app:assemblePerf --stacktrace

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test/
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mika-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/perf/*.apk
          if-no-files-found: error
